name: 报告问题
description: 报告无法使用、显示错误或学习记录异常
title: "[问题] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      description: 描述实际行为与预期行为，不要上传个人备份或私人备注。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现？
      placeholder: "1. 打开词库\n2. 点击……\n3. 出现……"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备和浏览器
      placeholder: iPhone 15 / iOS 18 / Safari 或主屏幕 App
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: 网络状态
      options: [联网, 离线或飞行模式, 不确定]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或补充信息
      description: 可附脱敏截图；请说明是否点击了应用中的「更新」。
